name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A release must finish before another changes the backend or image tag.
concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  checks:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ vars.NEXT_PUBLIC_CONVEX_SITE_URL }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_TELEMETRY_DISABLED: "1"
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Validate production configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: node scripts/deploy-production.mjs validate
      - run: pnpm install --frozen-lockfile
      # No backend deploy key or runtime API secrets are available to this build.
      - run: pnpm build
      - run: node scripts/prepare-runtime.mjs
      - name: Select image
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package runtime image on GitHub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify packaged runtime
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: node scripts/smoke-image.mjs "$TEST_IMAGE"
      # Push the exact image tested above; do not rebuild it for publication.
      - name: Publish tested image
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: docker push "$TEST_IMAGE"
      - name: Check Coolify before changing the backend
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.name }}
          DEPLOY_TAG: ${{ steps.image.outputs.tag }}
        run: node scripts/deploy-production.mjs preflight
      - name: Deploy Convex production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex deploy --yes
      - name: Deploy image in Coolify and wait for completion
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.name }}
          DEPLOY_TAG: ${{ steps.image.outputs.tag }}
        run: node scripts/deploy-production.mjs deploy
